<text x="24" y="866" fill="#9A9484" font-family="JetBrains Mono,monospace" font-size="11.5">phase 1 (bright) over phase 0 (dimmed) — coral = crossings from the actual conflict matrix</text>
<text x="976" y="850" text-anchor="end" fill="#FF5E3A" font-family="JetBrains Mono,monospace" font-size="13">4 crossings — cannot share a phase</text>
<text x="500" y="1170" text-anchor="middle" fill="#6A6358" font-family="JetBrains Mono,monospace" font-size="11">a bay-left never crosses its OWN throughs — shared origin, diverging paths — so those may share a phase; that is chord geometry, not a special case</text>
